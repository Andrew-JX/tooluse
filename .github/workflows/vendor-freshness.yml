name: 第三方副本陈旧检查

# 每周一 09:00（北京时间）跑一次，另可手动触发。
# 只报告：发现分叉就开 issue，不自动更新——跟不跟是判断，不是自动动作。
on:
  schedule:
    - cron: '0 1 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      LC_ALL: en_US.UTF-8   # 本机 C locale 藏过一个 set -u 崩溃，CI 用 UTF-8 跑
    steps:
      - uses: actions/checkout@v4

      - name: 比对各 SOURCE.md 的钉住 SHA 与上游
        id: check
        run: |
          # 脚本在「本地漂移」或「未知」时退出非零；上游前进属正常，退出 0。
          # 这里先捕获再判断，不让非零直接中断 job。
          set +e
          out=$(./scripts/check-vendor-freshness.sh 2>&1)
          rc=$?
          set -e
          echo "$out"
          echo "退出码 $rc"
          {
            echo 'report<<REPORT_EOF'
            echo "$out"
            echo 'REPORT_EOF'
          } >> "$GITHUB_OUTPUT"
          # 退出码是第一判据：脚本崩溃时连 ⚠/✗/?? 都来不及打印，
          # 只按输出前缀判断会把「崩了」读成「没问题」。
          if [ "$rc" -ne 0 ] || echo "$out" | grep -qE '^(⚠|✗|\?\?)'; then
            echo 'stale=true' >> "$GITHUB_OUTPUT"
          else
            echo 'stale=false' >> "$GITHUB_OUTPUT"
          fi
          echo "rc=$rc" >> "$GITHUB_OUTPUT"

      - name: 有分叉就开 issue
        if: steps.check.outputs.stale == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPORT: ${{ steps.check.outputs.report }}
          RC: ${{ steps.check.outputs.rc }}
        run: |
          title="第三方副本检查有异常（$(date -u +%Y-%m-%d)）"
          if gh issue list --state open --search "第三方副本检查 in:title" --json number -q '.[0].number' | grep -q .; then
            echo "已有未关闭的同类 issue，跳过"
            exit 0
          fi
          printf '%s\n' \
            '`scripts/check-vendor-freshness.sh` 有非「一致」的结论。三种情况含义不同：' '' \
            '- `✗` **本地漂移**：本地内容与钉住的 SHA 不符，第三方副本被本地改过——需要还原。' \
            '- `⚠` **上游已更新**：本地等于 pin，但上游 main 前进了——跟不跟是判断。' \
            '- `??` **未知**：取不到上游，本次结果不构成一致证明——不是「没问题」。' \
            "- 退出码 ${RC}：非零表示有漂移、未知，或脚本本身崩了。" '' \
            '' '```' "$REPORT" '```' '' \
            '**这不是待办，是一个判断题。** 上游改了不等于要跟——先看 diff 里改的是什么。' '' \
            '决定跟进：重新取回、更新对应 `SOURCE.md` 的钉住 SHA 与取回日期、在 `CHANGELOG.md` 记一行。' \
            '决定不跟：关掉这个 issue 即可，下周仍会再报。' > body.md
          gh issue create --title "$title" --body-file body.md
